plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'ro.eterra.check'
    compileSdk 35

    defaultConfig {
        applicationId 'ro.eterra.check'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
