name: Android APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            curl --fail --silent --show-error --location \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              --output "$RUNNER_TEMP/android-cli.zip"
            unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
            mkdir -p "$sdk_root/cmdline-tools"
            mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          fi
          (yes || true) | "$sdk_manager" --sdk_root="$sdk_root" --licenses >/dev/null
          "$sdk_manager" --sdk_root="$sdk_root" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
      - run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: eTerra-Check-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
